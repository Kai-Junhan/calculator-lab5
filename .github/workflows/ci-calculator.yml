name: Calculator CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ '17', '21' ]
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Java and cache Maven dependencies
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      - name: Compile source code
        run: mvn -B clean compile

      - name: Check Maven dependencies
        run: mvn -B dependency:analyze

      - name: Run JUnit 5 tests
        run: mvn -B test

  docker-build:
    name: Build and test Docker image
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t calculator:v1 .

      - name: Verify calculator inside container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm calculator:v1
          test "$(docker run --rm calculator:v1 12 + 3)" = '12 + 3 = 15.0'
          test "$(docker run --rm calculator:v1 12 - 3)" = '12 - 3 = 9.0'
          test "$(docker run --rm calculator:v1 12 '*' 3)" = '12 * 3 = 36.0'
          test "$(docker run --rm calculator:v1 12 / 3)" = '12 / 3 = 4.0'
          set +e
          output=$(docker run --rm calculator:v1 9 / 0 2>&1)
          status=$?
          set -e
          test "$status" -eq 1
          test "$output" = 'Calculation error: Division by zero is not allowed'
